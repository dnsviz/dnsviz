[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsviz"
version = "0.11.2"
authors = [
    { name = "Casey Deccio", email = "casey@deccio.net" }
]
description = "DNS analysis and visualization tool suite"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Networking :: Monitoring",
]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pygraphviz >= 1.3",
    "dnspython >= 1.13",
    "cryptography >= 36.0.0",
]

[project.urls]
homepage = "https://github.com/dnsviz/dnsviz/"
repository = "https://github.com/dnsviz/dnsviz/"
issues = "https://github.com/dnsviz/dnsviz/issues"

# The dnsviz script will be created automatically from the function
# dnsviz.commands.cli(), which is found in dnsviz/commands/__init__.py.
[project.scripts]
dnsviz = "dnsviz.commands:cli"
