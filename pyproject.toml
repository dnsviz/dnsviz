[build-system]
requires = ["setuptools"]

[project]
name = "dnsviz"
version = "0.11.2"
authors = [
    { name = "Casey Deccio", email = "casey@deccio.net" }
]
description = "DNS analysis and visualization tool suite"
readme = "README.md"
requires-python = ">=2.7"
#long_description = "DNSViz is a tool suite for analysis and visualization of Domain Name System (DNS) behavior, including its security extensions (DNSSEC).  This tool suite powers the Web-based analysis available at http://dnsviz.net/ ."
#long_description_content_type = "text/plain"

license = "GPL-2.0-or-later"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "pygraphviz >= 1.3",
    "dnspython >= 1.13",
    "cryptography >= 36.0.0",
]

[project.urls]
homepage = "https://github.com/dnsviz/dnsviz/"
repository = "https://github.com/dnsviz/dnsviz/"

[project.scripts]
dnsviz = "dnsviz.commands:cli"

# package discovery needs some guidance
[tool.setuptools.packages.find]
include = ["dnsviz"]
