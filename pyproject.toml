[project]
name = "dnsviz"
version = "0.11.1"
description = "DNS analysis and visualization tool suite"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Casey Deccio", email = "casey@deccio.net" }
]
keywords = ["DNS", "DNSSEC", "visualization", "analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "dnspython>=1.13",
    "cryptography>=36.0.0",
]

[project.optional-dependencies]
# pygraphviz is excluded from main dependencies as it requires graphviz-devel
# In containers, we use the system-provided python3-pygraphviz package
graphviz = [
    "pygraphviz>=1.3",
]

[project.urls]
Homepage = "https://github.com/dnsviz/dnsviz/"
Repository = "https://github.com/dnsviz/dnsviz/"

[project.scripts]
dnsviz = "bin.dnsviz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnsviz", "bin"]
only-include = ["dnsviz", "bin"]

[tool.hatch.build.targets.wheel.shared-data]
"share/dnsviz" = "share/dnsviz"
"share/doc/dnsviz" = "share/doc/dnsviz"
"share/man/man1" = "share/man/man1"

[tool.hatch.build.targets.sdist]
include = [
    "dnsviz/",
    "bin/",
    "share/",
    "doc/",
    "external/",
    "tests/",
    "README.md",
    "LICENSE",
    "COPYRIGHT",
    "requirements.txt",
]

[dependency-groups]
dev = []

